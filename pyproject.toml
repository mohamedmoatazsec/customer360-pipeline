[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer360-pipeline"
version = "1.0.0"
description = "A quality-gated customer and shopping-cart ELT portfolio project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6"]

[project.optional-dependencies]
analytics = ["pandas>=2.2,<4", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4"]
spark = ["pyspark>=3.5,<4"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4"]

[project.scripts]
customer360 = "customer360.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer360 = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
