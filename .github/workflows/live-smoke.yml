name: Live API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Read public synthetic API and validate snapshot
        run: python -m customer360 run --output data/live
      - name: Keep aggregate execution evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-quality-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            data/live/current.json
            data/live/runs/*/run.json
            data/live/runs/*/quality.json
            data/live/runs/*/gold/category_summary.csv
